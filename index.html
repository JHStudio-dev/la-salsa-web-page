<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Salsa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top jh-navbar">
        <div class="container">
            <a class="navbar-brand jh-logo" href="#">
    <div class="jh-logo-mark">LS</div>
    <div class="jh-logo-text">
        <span class="jh-logo-name">La Salsa</span>
        <span class="jh-logo-tagline">Tegucigalpa</span>
    </div>
</a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-lg-4 text-center">
                    <li class="nav-item"><a class="nav-link text-uppercase" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-uppercase" href="#menu">Menú</a></li>
                    <li class="nav-item"><a class="nav-link text-uppercase" href="#horarios">Horarios</a></li>
                </ul>
                <div class="ms-lg-4 text-center mt-3 mt-lg-0">
                    <button class="btn jh-btn-primary fw-bold">🌶 PEDIR</button>
                </div>
            </div>
        </div>
    </nav>
</body>

    <main>
        <header class="jh-hero-section py-5 mt-5">
            <div class="container text-center pt-5">
                <h1 class="display-2 fw-800 jh-title">Bienvenidos a La Salsa</h1>
                <p class="jh-subtitle text-uppercase">Nuestros mejores platillos</p>
            </div>

            <div class="jh-slider-container">
                  <div class="jh-banner">
        <div class="jh-slider" style="--quantity: 10">
            <div class="jh-item" style="--position: 1">
    <img src="fotos/food.jpg" alt="">
    <div class="jh-item-overlay"></div>
</div>
            <div class="jh-item" style="--position: 2">
    <img src="fotos/food2.jpg" alt="">
    <div class="jh-item-overlay"></div>
</div>
             <div class="jh-item" style="--position: 3">
    <img src="fotos/food3.jpg" alt="">
    <div class="jh-item-overlay"></div>
</div>
             <div class="jh-item" style="--position: 4">
    <img src="fotos/food4.jpg" alt="">
    <div class="jh-item-overlay"></div>
</div>
              <div class="jh-item" style="--position: 5">
    <img src="fotos/food5.jpg" alt="">
    <div class="jh-item-overlay"></div>
</div>
            <div class="jh-item" style="--position: 6">
    <img src="fotos/food6.jpg" alt="">
    <div class="jh-item-overlay"></div>
</div>  
            <div class="jh-item" style="--position: 7">
    <img src="fotos/food7.jpg" alt="">
    <div class="jh-item-overlay"></div>
</div>
            <div class="jh-item" style="--position: 8">
    <img src="fotos/food8.jpg" alt="">
    <div class="jh-item-overlay"></div>
</div>
            <div class="jh-item" style="--position: 9">
    <img src="fotos/food9.jpg" alt="">
    <div class="jh-item-overlay"></div>
</div> 
            <div class="jh-item" style="--position: 10">
    <img src="fotos/food10.jpg" alt="">
    <div class="jh-item-overlay"></div>
</div>
            </div>
        </div>
    </div>
                </div>
        </header>

        <section id="menu" class="py-5">
            <div class="container">
                <h2 class="text-center mb-5 jh-section-title">El Menú</h2>
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card jh-card h-100 bg-transparent border-secondary shadow-sm">
                            <img src="fotos/food.jpg" class="card-img-top rounded-4" alt="Platillo">
                            <div class="card-body text-center">
                                <h5 class="card-title">Tacos Especiales</h5>
                                <p class="card-text text-secondary">Preparados con ingredientes frescos del día.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
<!-- Modal -->
<div id="jh-modal" class="jh-modal">
  <div class="jh-modal__panel">
    <div class="jh-modal__img-wrap">
      <img id="jh-modal-img" src="" alt="">
      <div class="jh-modal__img-overlay"></div>
      <span id="jh-modal-badge" class="jh-modal__badge"></span>
      <button class="jh-modal__close" onclick="jhCerrarModal()">×</button>
    </div>
    <div class="jh-modal__body">
      <input type="hidden" id="jh-modal-id">
      <h3 id="jh-modal-nombre" class="jh-modal__nombre"></h3>
      <p id="jh-modal-desc" class="jh-modal__desc"></p>
      <div id="jh-modal-tags" class="jh-modal__tags"></div>
      <div class="jh-modal__footer">
        <div id="jh-modal-precio" class="jh-modal__precio"></div>
        <div class="jh-modal__qty">
          <button class="jh-qty-btn" onclick="jhCambiarCantidad(-1)">−</button>
          <span id="jh-modal-cantidad" class="jh-qty-num">1</span>
          <button class="jh-qty-btn" onclick="jhCambiarCantidad(1)">+</button>
        </div>
      </div>
      <button id="jh-btn-agregar" class="jh-btn-agregar" onclick="jhAgregarAlCarrito()">
        🛒 Agregar al carrito
      </button>
    </div>
  </div>
</div>

<!-- Panel del carrito -->
<div id="jh-cart-panel" class="jh-cart-panel">
  <div class="jh-cart-panel__head">
    <span class="jh-cart-panel__title">Tu pedido</span>
    <button class="jh-cart-panel__vaciar" onclick="jhVaciarCarrito()">✕ Vaciar todo</button>
  </div>
  <div class="jh-cart-panel__items" id="jh-cart-items">
    <div class="jh-cart-empty">Tu carrito está vacío 🌶</div>
  </div>
  <div class="jh-cart-panel__foot">
    <div class="jh-cart-panel__total">
      <span class="jh-cart-panel__total-lbl">Total</span>
      <span class="jh-cart-panel__total-num" id="jh-cart-total">L. 0</span>
    </div>
    <button class="jh-btn-whatsapp" onclick="jhPedirWhatsapp()">
      <span>📲 Enviar pedido por WhatsApp</span>
    </button>
  </div>
</div>

<!-- Botón flotante -->
<div class="jh-carrito" id="jh-carrito-btn" onclick="jhToggleCarrito()">
  🛒
  <span id="jh-carrito-badge" class="jh-carrito__badge" style="display:none">0</span>
</div>

<!---footer-->
<footer class="py-4 text-center border-top border-secondary mt-5">
        <p class="text-secondary small">&copy; 2026 La Salsa. Tegucigalpa, Honduras.</p>
    </footer>

    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
   <script src="js/data.js"></script>
<script src="js/app.js"></script>

</body>
</html>
    </html>
